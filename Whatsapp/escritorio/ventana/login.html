<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'" />
    <title>Entrar — Neifert WhatsApp</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <h1>Entrar al WhatsApp</h1>
    <p>Con tu usuario y contraseña del CRM.</p>
    <form id="form">
      <label>Usuario<input type="text" id="usuario" autocomplete="username" autofocus required /></label>
      <label>Contraseña<input type="password" id="clave" autocomplete="current-password" required /></label>
      <p class="error" id="error" hidden></p>
      <div class="fila final">
        <button type="button" class="btn secundario" id="cancelar">Cancelar</button>
        <button class="btn primario" id="entrar">Entrar</button>
      </div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id)
      $('cancelar').addEventListener('click', () => window.nfApp.cancelarLogin())
      $('form').addEventListener('submit', async (e) => {
        e.preventDefault()
        $('error').hidden = true
        $('entrar').disabled = true
        const r = await window.nfApp.login($('usuario').value, $('clave').value)
        if (!r.ok) {
          $('error').textContent = r.error
          $('error').hidden = false
          $('entrar').disabled = false
          $('clave').select()
        }
      })
    </script>
  </body>
</html>
